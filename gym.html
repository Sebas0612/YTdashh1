<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>Gym Tracker</title>
<script src="topbar.js" defer></script>
<style>
:root {
  --bg: #08090b;
  --panel: #101216;
  --panel-2: #151820;
  --soft: rgba(255,255,255,0.045);
  --soft-2: rgba(255,255,255,0.075);
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.15);
  --text: #f7f8fb;
  --muted: rgba(247,248,251,0.62);
  --faint: rgba(247,248,251,0.38);
  --green: #6ee7b7;
  --cyan: #7dd3fc;
  --red: #ff8a8a;
  --yellow: #fbbf24;
  --shadow: 0 20px 54px rgba(0,0,0,0.36);
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(34,45,56,0.72) 0%, rgba(8,9,11,0) 58%),
    var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
}
body { padding-bottom: max(28px, env(safe-area-inset-bottom)); }
button, input, select, textarea { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }
.app {
  width: min(760px, 100%);
  margin: 0 auto;
  padding: 18px 14px 96px;
}
.screen[hidden] { display: none !important; }
.top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}
.eyebrow {
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--faint);
  font-weight: 800;
}
.title {
  margin: 4px 0 0;
  font-size: 28px;
  line-height: 1.05;
  letter-spacing: 0;
}
.icon-btn,
.ghost-btn,
.primary-btn,
.danger-btn {
  border: 1px solid var(--border);
  color: var(--text);
  background: var(--soft);
  border-radius: 12px;
  min-height: 42px;
  padding: 10px 13px;
  cursor: pointer;
}
.icon-btn {
  width: 42px;
  padding: 0;
  display: inline-grid;
  place-items: center;
  font-size: 21px;
  line-height: 1;
}
.primary-btn {
  background: linear-gradient(135deg, rgba(125,211,252,0.22), rgba(110,231,183,0.18));
  border-color: rgba(125,211,252,0.22);
  font-weight: 800;
}
.danger-btn {
  color: var(--red);
  background: rgba(255,138,138,0.08);
  border-color: rgba(255,138,138,0.2);
}
.ghost-btn { color: var(--muted); }
.card {
  background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.025));
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow);
}
.calendar-card { padding: 14px; margin-bottom: 14px; }
.cal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.cal-title {
  font-weight: 850;
  font-size: 17px;
}
.cal-nav { display: flex; gap: 6px; }
.cal-nav button {
  width: 36px;
  height: 34px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--soft);
  color: var(--text);
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
}
.dow {
  text-align: center;
  color: var(--faint);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.12em;
  padding-bottom: 2px;
}
.day {
  position: relative;
  aspect-ratio: 1;
  border: 1px solid transparent;
  border-radius: 12px;
  color: var(--muted);
  background: rgba(255,255,255,0.025);
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 750;
}
.day.muted { opacity: 0.28; }
.day.done {
  color: var(--text);
  background: linear-gradient(135deg, rgba(125,211,252,0.20), rgba(110,231,183,0.20));
  border-color: rgba(110,231,183,0.20);
}
.day.selected {
  border-color: var(--cyan);
  box-shadow: inset 0 0 0 1px rgba(125,211,252,0.6);
}
.selected-panel {
  display: grid;
  gap: 10px;
  margin-bottom: 16px;
}
.compact-action {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px;
}
.compact-action strong { display: block; font-size: 15px; }
.compact-action span { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin: 18px 2px 9px;
}
.section-title {
  color: var(--faint);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 850;
}
.count-label {
  color: var(--muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.workout-list { display: grid; gap: 9px; }
.workout-row {
  width: 100%;
  text-align: left;
  padding: 14px;
  border-radius: 15px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.035);
  color: var(--text);
  cursor: pointer;
}
.workout-row-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.workout-row-title {
  font-weight: 850;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pill {
  flex: 0 0 auto;
  color: var(--green);
  background: rgba(110,231,183,0.10);
  border: 1px solid rgba(110,231,183,0.16);
  padding: 5px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
}
.workout-row-meta {
  margin-top: 8px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
}
.empty {
  color: var(--muted);
  text-align: center;
  padding: 20px 14px;
  border: 1px dashed var(--border);
  border-radius: 14px;
  background: rgba(255,255,255,0.02);
}
.fab {
  position: fixed;
  right: 18px;
  bottom: max(20px, env(safe-area-inset-bottom));
  z-index: 35;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: 1px solid rgba(125,211,252,0.30);
  background: linear-gradient(135deg, rgba(125,211,252,0.95), rgba(110,231,183,0.92));
  color: #051014;
  font-size: 32px;
  font-weight: 700;
  box-shadow: 0 18px 42px rgba(0,0,0,0.42);
  cursor: pointer;
}
.editor {
  display: grid;
  gap: 12px;
}
.editor-head {
  position: sticky;
  top: 0;
  z-index: 20;
  margin: -18px -14px 4px;
  padding: 12px 14px;
  background: rgba(8,9,11,0.94);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border);
}
.editor-title-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 8px;
  align-items: center;
}
.title-input,
.date-input,
.note-input,
.search-input,
.set-input,
.custom-input {
  width: 100%;
  border: 1px solid var(--border);
  background: rgba(0,0,0,0.24);
  color: var(--text);
  border-radius: 12px;
  min-height: 43px;
  padding: 10px 12px;
  outline: none;
}
.title-input {
  font-size: 18px;
  font-weight: 850;
}
.editor-meta {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: center;
  margin-top: 10px;
}
.duration {
  color: var(--muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.exercise-card {
  padding: 14px;
  overflow: hidden;
}
.exercise-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
}
.exercise-name {
  font-size: 17px;
  font-weight: 900;
  line-height: 1.15;
}
.exercise-sub {
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
}
.small-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.small-btn {
  border: 1px solid var(--border);
  background: var(--soft);
  color: var(--muted);
  border-radius: 10px;
  padding: 7px 9px;
  font-size: 12px;
}
.note-row { margin: 8px 0 10px; }
.set-head,
.set-row {
  display: grid;
  grid-template-columns: 34px 1fr 82px 72px 44px 38px;
  gap: 7px;
  align-items: center;
}
.set-head {
  color: var(--faint);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 850;
  margin-bottom: 6px;
}
.set-row {
  min-height: 48px;
  margin-bottom: 7px;
  padding: 5px;
  border-radius: 12px;
  background: rgba(255,255,255,0.028);
  border: 1px solid transparent;
}
.set-row.done {
  border-color: rgba(110,231,183,0.22);
  background: rgba(110,231,183,0.08);
}
.set-num {
  color: var(--muted);
  text-align: center;
  font-weight: 850;
}
.previous {
  color: var(--muted);
  font-size: 12px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.set-input {
  min-height: 38px;
  padding: 7px 8px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.check-btn {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--soft);
  color: var(--muted);
  font-weight: 900;
}
.set-row.done .check-btn {
  background: var(--green);
  border-color: var(--green);
  color: #07110d;
}
.delete-set-btn {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  border: 1px solid rgba(255,138,138,0.18);
  background: rgba(255,138,138,0.07);
  color: var(--red);
  font-weight: 900;
}
.add-set {
  width: 100%;
  margin-top: 4px;
}
.progress-card {
  padding: 14px;
  margin-top: 8px;
}
.progress-controls {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.progress-controls select {
  width: 100%;
  border: 1px solid var(--border);
  background: rgba(0,0,0,0.24);
  color: var(--text);
  border-radius: 12px;
  min-height: 43px;
  padding: 10px 12px;
}
.progress-chart {
  width: 100%;
  height: 190px;
  display: block;
  color: var(--cyan);
}
.progress-axis {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  color: var(--faint);
  font-size: 11px;
  margin-top: -6px;
  font-variant-numeric: tabular-nums;
}
.progress-grid {
  stroke: rgba(255,255,255,0.06);
  stroke-width: 1;
}
.progress-line {
  fill: none;
  stroke: currentColor;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 6px currentColor);
}
.progress-area {
  fill: currentColor;
  opacity: 0.12;
}
.progress-dot {
  fill: var(--green);
  stroke: #06100c;
  stroke-width: 2;
}
.progress-empty {
  color: var(--muted);
  text-align: center;
  padding: 18px 8px;
  font-size: 13px;
}
.progress-list {
  display: grid;
  gap: 7px;
  margin-top: 10px;
}
.progress-row {
  display: grid;
  grid-template-columns: 82px 1fr auto;
  gap: 8px;
  align-items: center;
  color: var(--muted);
  background: rgba(255,255,255,0.028);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 9px 10px;
  font-size: 12px;
}
.progress-row strong {
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.workout-actions {
  position: sticky;
  bottom: 0;
  z-index: 22;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 8px -14px 0;
  padding: 12px 14px max(14px, env(safe-area-inset-bottom));
  background: linear-gradient(180deg, rgba(8,9,11,0), rgba(8,9,11,0.94) 24%, rgba(8,9,11,0.98));
}
.workout-actions .primary-btn { grid-column: span 2; }
.picker {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: none;
  background: rgba(0,0,0,0.62);
}
.picker.show { display: grid; align-items: end; }
.picker-sheet {
  max-height: min(86vh, 760px);
  overflow: auto;
  border-radius: 22px 22px 0 0;
  background: #0d0f13;
  border: 1px solid var(--border-strong);
  padding: 14px;
  box-shadow: 0 -20px 60px rgba(0,0,0,0.5);
}
.picker-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}
.filter-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 8px 0 10px;
}
.filter-grid select {
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.045);
  color: var(--text);
  border-radius: 12px;
  min-height: 42px;
  padding: 9px 10px;
}
.exercise-list { display: grid; gap: 7px; }
.pick-row {
  width: 100%;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.035);
  color: var(--text);
  border-radius: 13px;
  padding: 12px;
  text-align: left;
}
.pick-row strong { display: block; }
.pick-row span { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
.custom-box {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 7px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.detail-card {
  padding: 14px;
}
.detail-exercise {
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: rgba(255,255,255,0.03);
  margin-top: 9px;
}
.detail-sets {
  color: var(--muted);
  font-size: 13px;
  margin-top: 6px;
  line-height: 1.45;
}
.timer {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: max(14px, env(safe-area-inset-bottom));
  z-index: 70;
  display: none;
  align-items: center;
  gap: 10px;
  padding: 12px;
  border-radius: 18px;
  background: rgba(15,18,23,0.96);
  border: 1px solid rgba(125,211,252,0.2);
  box-shadow: 0 20px 52px rgba(0,0,0,0.46);
}
.timer.show { display: flex; }
.timer-main { flex: 1; min-width: 0; }
.timer-label {
  color: var(--faint);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 850;
}
.timer-time {
  font-size: 26px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
}
.timer-actions { display: flex; gap: 6px; }
.timer-actions button {
  min-width: 38px;
  height: 38px;
  padding: 0 9px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--soft);
  color: var(--text);
  font-weight: 850;
}
@media (max-width: 520px) {
  .app { padding-left: 12px; padding-right: 12px; }
  .title { font-size: 25px; }
  .set-head,
  .set-row { grid-template-columns: 28px 1fr 58px 52px 36px 34px; gap: 5px; }
  .previous { font-size: 11px; }
  .set-input { font-size: 13px; }
  .custom-box { grid-template-columns: 1fr; }
  .progress-row { grid-template-columns: 72px 1fr; }
  .progress-row strong { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<main class="app">
  <section class="screen" id="homeScreen">
    <div class="top-row">
      <div>
        <div class="eyebrow">Training</div>
        <h1 class="title">Workout Tracker</h1>
      </div>
      <button class="icon-btn" id="todayBtn" type="button" title="Today">.</button>
    </div>

    <div class="calendar-card card">
      <div class="cal-head">
        <button class="icon-btn" id="prevMonth" type="button" aria-label="Previous month">&lt;</button>
        <div class="cal-title" id="calendarTitle">Month</div>
        <button class="icon-btn" id="nextMonth" type="button" aria-label="Next month">&gt;</button>
      </div>
      <div class="cal-grid" id="calendarGrid"></div>
    </div>

    <div class="selected-panel">
      <div class="compact-action card">
        <div>
          <strong id="selectedDateLabel">Today</strong>
          <span id="selectedSummary">No workout selected.</span>
        </div>
        <button class="primary-btn" id="startWorkoutBtn" type="button">Start Workout</button>
      </div>
      <div class="workout-list" id="selectedWorkouts"></div>
    </div>

    <div class="section-head">
      <div class="section-title">Recent workouts</div>
      <div class="count-label" id="recentCount">0</div>
    </div>
    <div class="workout-list" id="recentWorkouts"></div>

    <div class="section-head">
      <div class="section-title">Exercise Progress</div>
      <div class="count-label" id="progressCount">0 points</div>
    </div>
    <div class="progress-card card">
      <div class="progress-controls">
        <select id="progressExercise"></select>
      </div>
      <svg class="progress-chart" id="progressSvg" viewBox="0 0 600 220" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="progress-axis" id="progressAxis"></div>
      <div class="progress-empty" id="progressEmpty">Finish workouts to chart exercise progress.</div>
      <div class="progress-list" id="progressList"></div>
    </div>
  </section>

  <section class="screen" id="workoutScreen" hidden>
    <div class="editor">
      <div class="editor-head">
        <div class="editor-title-row">
          <button class="icon-btn" id="closeWorkoutBtn" type="button" aria-label="Back">&lt;</button>
          <input class="title-input" id="workoutTitle" type="text" placeholder="Workout name">
          <button class="icon-btn" id="addExerciseTopBtn" type="button" aria-label="Add exercise">+</button>
        </div>
        <div class="editor-meta">
          <input class="date-input" id="workoutDate" type="date">
          <div class="duration" id="workoutDuration">00:00</div>
        </div>
      </div>

      <div id="exerciseStack"></div>
      <button class="ghost-btn" id="addExerciseBtn" type="button">Add Exercise</button>

      <div class="workout-actions">
        <button class="ghost-btn" id="saveLaterBtn" type="button">Save For Later</button>
        <button class="danger-btn" id="deleteDraftBtn" type="button">Delete</button>
        <button class="primary-btn" id="finishWorkoutBtn" type="button">Finish Workout</button>
      </div>
    </div>
  </section>

  <section class="screen" id="detailScreen" hidden>
    <div class="top-row">
      <button class="icon-btn" id="backFromDetail" type="button" aria-label="Back">&lt;</button>
      <div style="flex:1;min-width:0">
        <div class="eyebrow" id="detailDate">Workout</div>
        <h1 class="title" id="detailTitle">Workout</h1>
      </div>
      <button class="ghost-btn" id="editWorkoutBtn" type="button">Edit</button>
    </div>
    <div class="detail-card card" id="detailBody"></div>
  </section>
</main>

<button class="fab" id="fab" type="button" aria-label="Create workout">+</button>

<div class="picker" id="exercisePicker" aria-hidden="true">
  <div class="picker-sheet">
    <div class="picker-head">
      <div>
        <div class="eyebrow">Exercise library</div>
        <h2 style="margin:3px 0 0;font-size:21px">Add exercise</h2>
      </div>
      <button class="icon-btn" id="closePicker" type="button" aria-label="Close">x</button>
    </div>
    <input class="search-input" id="exerciseSearch" type="search" placeholder="Search exercises">
    <div class="filter-grid">
      <select id="muscleFilter"></select>
      <select id="equipmentFilter"></select>
    </div>
    <div class="exercise-list" id="exerciseList"></div>
    <div class="custom-box">
      <input class="custom-input" id="customName" type="text" placeholder="Custom exercise">
      <select id="customMuscle"></select>
      <button class="primary-btn" id="customAdd" type="button">Create</button>
    </div>
  </div>
</div>

<div class="timer" id="restTimer">
  <div class="timer-main">
    <div class="timer-label">Rest timer</div>
    <div class="timer-time" id="timerTime">02:00</div>
  </div>
  <div class="timer-actions">
    <button id="timerMinus" type="button">-30</button>
    <button id="timerToggle" type="button">Pause</button>
    <button id="timerPlus" type="button">+30</button>
    <button id="timerClose" type="button">x</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  const LS_KEY = 'gym_tracker_v2';
  const OLD_KEY = 'po_coach_v1';
  const UNIT = 'kg';
  const DEFAULT_REST = 120;
  const originalTitle = document.title;

  const DEFAULT_EXERCISES = [
    { name: 'Bench Press', muscle: 'Chest', equipment: 'Barbell' },
    { name: 'Incline Smith Machine Bench Press', muscle: 'Chest', equipment: 'Smith Machine' },

  const MUSCLES = ['All muscles', 'Chest', 'Back', 'Biceps', 'Triceps', 'Shoulders', 'Abs', 'Legs', 'Hamstrings', 'Calves', 'Custom'];
  const EQUIPMENT = ['All equipment', 'Barbell', 'Dumbbell', 'Cable', 'Machine', 'Smith Machine', 'Bodyweight', 'Custom'];

  let state = loadState();

  const $ = id => document.getElementById(id);
  function uid(prefix) { return prefix + '_' + Date.now() + '_' + Math.floor(Math.random() * 99999); }
  function pad(n) { return String(n).padStart(2, '0'); }

  function monthStart(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }

  }
  function fmtMonth(d) { return d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }); }
  function fmtDuration(sec) {
    sec = Math.max(0, Math.floor(sec || 0));

  function escapeHtml(s) {

  }
  function normalizedExerciseName(s) {

  function seedLibrary() {
    return DEFAULT_EXERCISES.map(e => ({
      id: slug(e.name),
      name: e.name,
      muscle: e.muscle,
      equipment: e.equipment,
      custom: false
    }));
  }
  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  }
  function defaultState() {
    return { version: 2, exercises: seedLibrary(), workouts: [], selectedDate: todayKey(), migratedFrom: null };
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(LS_KEY);

    } catch (_) {}

    return migrated;
  }
  function normalize(s) {
    s = s || defaultState();
    s.version = 2;
    s.exercises = Array.isArray(s.exercises) && s.exercises.length ? mergeLibrary(s.exercises) : seedLibrary();
    s.workouts = Array.isArray(s.workouts) ? s.workouts : [];
    s.workouts.forEach(w => {
      w.exercises = Array.isArray(w.exercises) ? w.exercises : [];
      w.exercises.forEach(ex => {
        ex.sets = Array.isArray(ex.sets) ? ex.sets : [];

  function mergeLibrary(items) {

        id: e.id || slug(e.name),
        name: e.name,
        muscle: e.muscle || 'Custom',

    return Object.values(byName).sort((a, b) => a.name.localeCompare(b.name));

  function migrateOldState() {
    const next = defaultState();
    try {
      const old = JSON.parse(localStorage.getItem(OLD_KEY) || 'null');
      if (!old || !Array.isArray(old.exercises) || !old.logs) return next;
      next.migratedFrom = OLD_KEY;
      const oldExercises = old.exercises.map(ex => ({
        id: ex.id || slug(ex.name),
        name: titleCase(ex.name || 'Exercise'),
        muscle: oldDayToMuscle(ex.day),
        equipment: ex.bw ? 'Bodyweight' : 'Custom',
        custom: true
      }));
      next.exercises = mergeLibrary(next.exercises.concat(oldExercises));
      const byDay = {};
      old.exercises.forEach(oldEx => {
        const lib = next.exercises.find(e => e.name.toLowerCase() === titleCase(oldEx.name || '').toLowerCase());
        (old.logs[oldEx.id] || []).forEach(log => {
          const dk = String(log.date || '').slice(0, 10) || todayKey();
          byDay[dk] = byDay[dk] || {};
          const exId = lib ? lib.id : slug(oldEx.name || 'exercise');
          byDay[dk][exId] = byDay[dk][exId] || {
            id: uid('we'),
            exerciseId: exId,
            name: lib ? lib.name : titleCase(oldEx.name || 'Exercise'),
            note: '',
            sets: []
          };
          byDay[dk][exId].sets.push({
            weight: Number(log.weight) || 0,
            reps: Number(log.reps) || 0,
            completed: true,
            completedAt: log.date || new Date().toISOString()
          });
        });
      });
      Object.keys(byDay).sort().forEach(dk => {
        next.workouts.push({
          id: uid('w'),
          title: 'Migrated Workout',
          date: dk,
          status: 'completed',
          startedAt: new Date(dk + 'T12:00:00').toISOString(),
          finishedAt: new Date(dk + 'T13:00:00').toISOString(),
          durationSec: 3600,
          exercises: Object.values(byDay[dk])

    } catch (_) {}

  }
  function oldDayToMuscle(day) {

  function save() {

  function workoutsOnDate(key) {

  function showScreen(name) {

  function renderHome() {

  function renderCalendar() {

    const dows = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    let html = dows.map(d => '<div class="dow">' + d + '</div>').join('');
    const first = new Date(calendarCursor);
    const start = new Date(first);
    const offset = (first.getDay() + 6) % 7;
    start.setDate(first.getDate() - offset);
    for (let i = 0; i < 42; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const key = dateKey(d);
      const cls = [
        'day',
        d.getMonth() !== calendarCursor.getMonth() ? 'muted' : '',

        key === selectedDate ? 'selected' : ''

      html += '<button class="' + cls + '" data-date="' + key + '" type="button">' + d.getDate() + '</button>';

    grid.innerHTML = html;
    grid.querySelectorAll('.day').forEach(btn => {

  function renderSelectedWorkouts() {
    const list = $('selectedWorkouts');

  function renderRecent() {

  function progressExerciseOptions() {
    const seen = {};
    completedWorkouts().forEach(w => {
      (w.exercises || []).forEach(ex => {
        if (!ex || !ex.name) return;
        const key = ex.exerciseId || normalizedExerciseName(ex.name);
        seen[key] = { id: key, name: ex.name };
      });
    });
    state.exercises.forEach(ex => {
      const key = ex.id || normalizedExerciseName(ex.name);
      if (!seen[key]) seen[key] = { id: key, name: ex.name };
    });
    return Object.values(seen).sort((a, b) => a.name.localeCompare(b.name));
  }
  function renderProgress() {
    const sel = $('progressExercise');
    const options = progressExerciseOptions();
    const prev = state.progressExerciseId || sel.value;
    sel.innerHTML = options.map(o => '<option value="' + escapeHtml(o.id) + '">' + escapeHtml(o.name) + '</option>').join('');
    if (options.some(o => o.id === prev)) sel.value = prev;
    else if (options[0]) sel.value = options[0].id;
    state.progressExerciseId = sel.value;
    const points = progressPoints(sel.value);
    $('progressCount').textContent = points.length + ' points';
    renderProgressChart(points);
    renderProgressList(points);
  }
  function progressPoints(exerciseKey) {
    if (!exerciseKey) return [];
    const byDate = {};
    completedWorkouts()
      .slice()
      .sort((a, b) => String(a.date).localeCompare(String(b.date)))
      .forEach(w => {
        (w.exercises || []).forEach(ex => {
          const matches =
            (ex.exerciseId && ex.exerciseId === exerciseKey) ||
            normalizedExerciseName(ex.name) === normalizedExerciseName(exerciseKey) ||
            state.exercises.some(lib => lib.id === exerciseKey && normalizedExerciseName(lib.name) === normalizedExerciseName(ex.name));
          if (!matches) return;
          (ex.sets || []).filter(s => s.completed).forEach(set => {
            const weight = Number(set.weight) || 0;
            const reps = Number(set.reps) || 0;
            if (!reps) return;
            const e1rm = weight * (1 + reps / 30);
            const cur = byDate[w.date];
            if (!cur || e1rm > cur.e1rm) byDate[w.date] = { date: w.date, weight, reps, e1rm };
          });
        });
      });

  function renderProgressChart(points) {
    const svg = $('progressSvg');
    const empty = $('progressEmpty');
    if (!points.length) {
      svg.innerHTML = '';
      $('progressAxis').innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    const W = 600, H = 220, pad = 18;
    const vals = points.map(p => p.e1rm);
    const min = Math.min.apply(null, vals);
    const max = Math.max.apply(null, vals);
    const range = (max - min) || Math.max(1, max);
    const coords = points.map((p, i) => ({
      x: points.length === 1 ? W / 2 : pad + (i / (points.length - 1)) * (W - pad * 2),
      y: H - pad - ((p.e1rm - min) / range) * (H - pad * 2)
    }));
    const line = coords.length === 1
      ? 'M' + (coords[0].x - 60) + ',' + coords[0].y + ' L' + (coords[0].x + 60) + ',' + coords[0].y
      : coords.map((p, i) => (i ? 'L' : 'M') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
    const first = coords[0], last = coords[coords.length - 1];
    const area = line + ' L' + last.x + ',' + H + ' L' + first.x + ',' + H + ' Z';
    svg.innerHTML =
      '<line class="progress-grid" x1="0" x2="' + W + '" y1="55" y2="55"></line>' +
      '<line class="progress-grid" x1="0" x2="' + W + '" y1="110" y2="110"></line>' +
      '<line class="progress-grid" x1="0" x2="' + W + '" y1="165" y2="165"></line>' +
      '<path class="progress-area" d="' + area + '"></path>' +
      '<path class="progress-line" d="' + line + '"></path>' +
      coords.map((p, i) => '<circle class="progress-dot" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="4"><title>' + escapeHtml(points[i].date + ' · ' + points[i].e1rm.toFixed(1) + UNIT) + '</title></circle>').join('');
    $('progressAxis').innerHTML =
      '<span>' + escapeHtml(points[0].date) + '</span>' +
      '<span>' + min.toFixed(1) + '-' + max.toFixed(1) + UNIT + ' e1RM</span>' +
      '<span>' + escapeHtml(points[points.length - 1].date) + '</span>';
  }
  function renderProgressList(points) {
    $('progressList').innerHTML = points.slice().reverse().slice(0, 6).map(p =>
      '<div class="progress-row"><span>' + escapeHtml(fmtDate(p.date)) + '</span><span>' + escapeHtml(p.weight + UNIT + ' x ' + p.reps) + '</span><strong>e1RM ' + p.e1rm.toFixed(1) + UNIT + '</strong></div>'

  function workoutRow(w) {

      + '</button>';

  function createWorkout(date) {
    const w = {
      id: uid('w'),

  function openWorkout(id) {

  function renderWorkoutEditor() {
    const w = currentWorkout();

  function exerciseCard(w, ex, exIdx) {
    const previous = previousPerformance(ex, w);
    const noteHtml = ex.note ? '<div class="note-row"><div class="exercise-sub">' + escapeHtml(ex.note) + '</div></div>' : '';
    return '<div class="exercise-card card" data-ex-card="' + ex.id + '">'
      + '<div class="exercise-head">'
      + '<div><div class="exercise-name">' + escapeHtml(ex.name) + '</div><div class="exercise-sub">' + (previous.length ? 'Previous: ' + escapeHtml(previous.map(p => p.weight + UNIT + ' x ' + p.reps).join(', ')) : 'No previous sets yet') + '</div></div>'
      + '<div class="small-actions"><button class="small-btn" data-note-toggle="' + ex.id + '" type="button">Note</button><button class="small-btn" data-remove-ex="' + ex.id + '" type="button">Remove</button></div>'
      + '</div>'
      + noteHtml
      + '<div class="set-head"><div>Set</div><div>Previous</div><div>Weight</div><div>Reps</div><div></div><div></div></div>'
      + ex.sets.map((set, setIdx) => setRow(ex, set, setIdx, previous[setIdx])).join('')

  function setRow(ex, set, setIdx, prev) {

      + '<div class="set-num">' + (setIdx + 1) + '</div>'

      + '<input class="set-input" data-set-reps="' + ex.id + ':' + setIdx + '" type="number" step="1" value="' + escapeHtml(set.reps || '') + '" placeholder="0">'
      + '<button class="check-btn" data-complete-set="' + ex.id + ':' + setIdx + '" type="button">' + (set.completed ? '✓' : '') + '</button>'
      + '<button class="delete-set-btn" data-delete-set="' + ex.id + ':' + setIdx + '" type="button" aria-label="Delete set">×</button>'
      + '</div>';

  function bindExerciseCards() {
    document.querySelectorAll('[data-add-set]').forEach(btn => btn.addEventListener('click', () => {
      const ex = findWorkoutExercise(btn.dataset.addSet);
      if (!ex) return;
      ex.sets.push(emptySet());
      save();
      renderWorkoutEditor();
    }));
    document.querySelectorAll('[data-remove-ex]').forEach(btn => btn.addEventListener('click', () => {
      const w = currentWorkout();
      if (!w || !confirm('Remove this exercise from the workout?')) return;
      w.exercises = w.exercises.filter(ex => ex.id !== btn.dataset.removeEx);
      save();
      renderWorkoutEditor();
    }));
    document.querySelectorAll('[data-note-toggle]').forEach(btn => btn.addEventListener('click', () => {
      const ex = findWorkoutExercise(btn.dataset.noteToggle);
      if (!ex) return;
      const next = prompt('Exercise note:', ex.note || '');
      if (next == null) return;
      ex.note = next.trim();
      save();
      renderWorkoutEditor();
    }));
    document.querySelectorAll('[data-set-weight]').forEach(inp => inp.addEventListener('input', () => updateSetField(inp.dataset.setWeight, 'weight', inp.value)));
    document.querySelectorAll('[data-set-reps]').forEach(inp => inp.addEventListener('input', () => updateSetField(inp.dataset.setReps, 'reps', inp.value)));
    document.querySelectorAll('[data-complete-set]').forEach(btn => btn.addEventListener('click', () => completeSet(btn.dataset.completeSet)));
    document.querySelectorAll('[data-delete-set]').forEach(btn => btn.addEventListener('click', () => deleteSet(btn.dataset.deleteSet)));
  }
  function findWorkoutExercise(id) {
    const w = currentWorkout();
    return w ? w.exercises.find(ex => ex.id === id) : null;
  }
  function parseSetKey(key) {
    const parts = String(key).split(':');
    return { exId: parts[0], idx: Number(parts[1]) };
  }
  function updateSetField(key, field, value) {
    const p = parseSetKey(key);
    const ex = findWorkoutExercise(p.exId);
    if (!ex || !ex.sets[p.idx]) return;
    ex.sets[p.idx][field] = value === '' ? '' : Number(value);
    save();
  }
  function completeSet(key) {
    const p = parseSetKey(key);
    const ex = findWorkoutExercise(p.exId);
    if (!ex || !ex.sets[p.idx]) return;
    const set = ex.sets[p.idx];
    if (!(Number(set.reps) > 0)) { alert('Enter reps first.'); return; }
    if (!(Number(set.weight) >= 0)) set.weight = 0;
    set.completed = !set.completed;
    set.completedAt = set.completed ? new Date().toISOString() : null;
    save();
    renderWorkoutEditor();
    if (set.completed) startRestTimer(DEFAULT_REST);
  }
  function deleteSet(key) {
    const p = parseSetKey(key);
    const ex = findWorkoutExercise(p.exId);
    if (!ex || !ex.sets[p.idx]) return;
    ex.sets.splice(p.idx, 1);
    save();
    renderWorkoutEditor();
  }
  function previousPerformance(ex, workout) {
    const targetId = ex.exerciseId || '';
    const targetName = normalizedExerciseName(ex.name);
    const workoutMoment = new Date(workout.startedAt || (workout.date + 'T23:59:59')).getTime();
    const before = completedWorkouts()
      .filter(w => w.id !== workout.id)
      .filter(w => {
        const t = new Date(w.finishedAt || (w.date + 'T23:59:59')).getTime();
        return isNaN(workoutMoment) || isNaN(t) ? w.date <= workout.date : t < workoutMoment;
      })
      .sort((a, b) => {
        const at = new Date(a.finishedAt || (a.date + 'T23:59:59')).getTime();
        const bt = new Date(b.finishedAt || (b.date + 'T23:59:59')).getTime();
        return bt - at;
      });
    for (const w of before) {
      const match = (w.exercises || []).find(e =>
        (targetId && e.exerciseId && e.exerciseId === targetId) ||
        normalizedExerciseName(e.name) === targetName
      );
      if (match) return (match.sets || []).filter(s => s.completed).map(s => ({ weight: Number(s.weight) || 0, reps: Number(s.reps) || 0 }));
    }
    return [];
  }

  function openPicker() {
    renderPicker();
    $('exercisePicker').classList.add('show');
    $('exercisePicker').setAttribute('aria-hidden', 'false');
    $('exerciseSearch').focus();
  }
  function closePicker() {
    $('exercisePicker').classList.remove('show');
    $('exercisePicker').setAttribute('aria-hidden', 'true');
  }
  function renderPicker() {
    fillSelect('muscleFilter', MUSCLES);
    fillSelect('equipmentFilter', EQUIPMENT);
    fillSelect('customMuscle', MUSCLES.filter(m => m !== 'All muscles'));
    const q = ($('exerciseSearch').value || '').trim().toLowerCase();
    const muscle = $('muscleFilter').value || 'All muscles';
    const equip = $('equipmentFilter').value || 'All equipment';
    const items = state.exercises.filter(e => {
      const okQ = !q || e.name.toLowerCase().includes(q);
      const okM = muscle === 'All muscles' || e.muscle === muscle;
      const okE = equip === 'All equipment' || e.equipment === equip;
      return okQ && okM && okE;
    });
    $('exerciseList').innerHTML = items.length ? items.map(e =>
      '<button class="pick-row" type="button" data-pick-ex="' + e.id + '"><strong>' + escapeHtml(e.name) + '</strong><span>' + escapeHtml(e.muscle) + ' · ' + escapeHtml(e.equipment) + '</span></button>'
    ).join('') : '<div class="empty">No exercises found.</div>';
    $('exerciseList').querySelectorAll('[data-pick-ex]').forEach(btn => btn.addEventListener('click', () => addExerciseToWorkout(btn.dataset.pickEx)));
  }
  function fillSelect(id, arr) {
    const sel = $(id);
    if (!sel || sel.options.length) return;
    sel.innerHTML = arr.map(v => '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + '</option>').join('');
  }
  function addExerciseToWorkout(exerciseId) {
    const w = currentWorkout();
    const lib = state.exercises.find(e => e.id === exerciseId);
    if (!w || !lib) return;
    w.exercises.push({
      id: uid('we'),
      exerciseId: lib.id,
      name: lib.name,
      note: '',
      sets: defaultSets()
    });
    save();
    closePicker();
    renderWorkoutEditor();
  }
  function createCustomExercise() {
    const name = ($('customName').value || '').trim();
    if (!name) { $('customName').focus(); return; }
    const existing = state.exercises.find(e => e.name.toLowerCase() === name.toLowerCase());
    if (existing) { addExerciseToWorkout(existing.id); return; }
    const ex = { id: 'custom_' + slug(name) + '_' + Date.now(), name, muscle: $('customMuscle').value || 'Custom', equipment: 'Custom', custom: true };
    state.exercises.push(ex);
    state.exercises = mergeLibrary(state.exercises);
    save();
    $('customName').value = '';
    addExerciseToWorkout(ex.id);
  }

  function saveWorkoutForLater() {
    const w = currentWorkout();
    if (!w) return;
    syncWorkoutFields(w);
    w.status = 'draft';
    save();
    stopDurationTicker();
    renderHome();
  }
  function finishWorkout() {
    const w = currentWorkout();
    if (!w) return;
    syncWorkoutFields(w);
    const completedSets = workoutSetCount(w);
    if (!completedSets && !confirm('Finish workout with no completed sets?')) return;
    w.status = 'completed';
    w.finishedAt = new Date().toISOString();
    w.durationSec = Math.max(1, Math.round((new Date(w.finishedAt) - new Date(w.startedAt || w.finishedAt)) / 1000));
    selectedDate = w.date;
    calendarCursor = monthStart(parseDate(w.date));
    save();
    dismissTimer();
    stopDurationTicker();
    renderHome();
  }
  function syncWorkoutFields(w) {
    w.title = $('workoutTitle').value.trim() || 'Workout';
    w.date = $('workoutDate').value || todayKey();
  }
  function deleteDraft() {
    const w = currentWorkout();
    if (!w || !confirm('Delete this workout?')) return;
    state.workouts = state.workouts.filter(x => x.id !== w.id);
    activeWorkoutId = null;
    save();
    stopDurationTicker();
    renderHome();
  }
  function startDurationTicker() {
    stopDurationTicker();
    durationTimer = setInterval(updateDurationLabel, 1000);
    updateDurationLabel();
  }
  function stopDurationTicker() {
    if (durationTimer) clearInterval(durationTimer);
    durationTimer = null;
  }
  function updateDurationLabel() {
    const w = currentWorkout();
    if (!w) return;
    syncWorkoutFields(w);
    const sec = w.status === 'completed' ? w.durationSec : Math.round((Date.now() - new Date(w.startedAt || new Date()).getTime()) / 1000);
    $('workoutDuration').textContent = fmtDuration(sec);
  }

  function openDetail(id) {
    const w = state.workouts.find(x => x.id === id);
    if (!w) return;
    detailWorkoutId = id;
    showScreen('detailScreen');
    $('detailDate').textContent = fmtDate(w.date) + (w.durationSec ? ' · ' + fmtDuration(w.durationSec) : '');
    $('detailTitle').textContent = w.title || 'Workout';
    $('detailBody').innerHTML = (w.exercises || []).length ? w.exercises.map(ex =>
      '<div class="detail-exercise"><strong>' + escapeHtml(ex.name) + '</strong>'
      + (ex.note ? '<div class="detail-sets">' + escapeHtml(ex.note) + '</div>' : '')
      + '<div class="detail-sets">' + (ex.sets || []).filter(s => s.completed).map((s, i) => 'Set ' + (i + 1) + ': ' + (Number(s.weight) || 0) + UNIT + ' x ' + (Number(s.reps) || 0)).join('<br>') + '</div></div>'
    ).join('') : '<div class="empty">No exercises saved.</div>';
  }

  function startRestTimer(seconds) {
    rest.remaining = seconds || DEFAULT_REST;
    rest.running = true;
    $('restTimer').classList.add('show');
    tickTimerDisplay();
    if (rest.interval) clearInterval(rest.interval);
    rest.interval = setInterval(() => {
      if (!rest.running) return;
      rest.remaining -= 1;
      if (rest.remaining <= 0) {
        rest.remaining = 0;
        rest.running = false;
        clearInterval(rest.interval);
        rest.interval = null;
      }
      tickTimerDisplay();
    }, 1000);
  }
  function tickTimerDisplay() {
    $('timerTime').textContent = fmtDuration(rest.remaining);
    $('timerToggle').textContent = rest.running ? 'Pause' : 'Resume';
    document.title = $('restTimer').classList.contains('show') ? fmtDuration(rest.remaining) + ' Rest' : originalTitle;
  }
  function dismissTimer() {
    if (rest.interval) clearInterval(rest.interval);
    rest.interval = null;
    rest.running = false;
    $('restTimer').classList.remove('show');
    document.title = originalTitle;
  }

  function bindEvents() {
    $('prevMonth').addEventListener('click', () => { calendarCursor.setMonth(calendarCursor.getMonth() - 1); renderCalendar(); });
    $('nextMonth').addEventListener('click', () => { calendarCursor.setMonth(calendarCursor.getMonth() + 1); renderCalendar(); });
    $('todayBtn').addEventListener('click', () => { selectedDate = todayKey(); calendarCursor = monthStart(new Date()); renderHome(); });
    $('startWorkoutBtn').addEventListener('click', () => createWorkout(selectedDate));
    $('fab').addEventListener('click', () => createWorkout(selectedDate));
    $('closeWorkoutBtn').addEventListener('click', saveWorkoutForLater);
    $('workoutTitle').addEventListener('input', () => { const w = currentWorkout(); if (w) { w.title = $('workoutTitle').value; save(); } });
    $('workoutDate').addEventListener('change', () => { const w = currentWorkout(); if (w) { w.date = $('workoutDate').value; save(); } });
    $('addExerciseBtn').addEventListener('click', openPicker);
    $('addExerciseTopBtn').addEventListener('click', openPicker);
    $('saveLaterBtn').addEventListener('click', saveWorkoutForLater);
    $('finishWorkoutBtn').addEventListener('click', finishWorkout);
    $('deleteDraftBtn').addEventListener('click', deleteDraft);
    $('closePicker').addEventListener('click', closePicker);
    $('exercisePicker').addEventListener('click', e => { if (e.target.id === 'exercisePicker') closePicker(); });
    $('exerciseSearch').addEventListener('input', renderPicker);
    $('muscleFilter').addEventListener('change', renderPicker);
    $('equipmentFilter').addEventListener('change', renderPicker);
    $('customAdd').addEventListener('click', createCustomExercise);
    $('customName').addEventListener('keydown', e => { if (e.key === 'Enter') createCustomExercise(); });
    $('progressExercise').addEventListener('change', () => {
      state.progressExerciseId = $('progressExercise').value;
      save();
      renderProgress();
    });
    $('backFromDetail').addEventListener('click', renderHome);
    $('editWorkoutBtn').addEventListener('click', () => { if (detailWorkoutId) openWorkout(detailWorkoutId); });
    $('timerMinus').addEventListener('click', () => { rest.remaining = Math.max(0, rest.remaining - 30); tickTimerDisplay(); });
    $('timerPlus').addEventListener('click', () => { rest.remaining += 30; tickTimerDisplay(); });
    $('timerToggle').addEventListener('click', () => {
      rest.running = !rest.running;
      if (rest.running && !rest.interval) startRestTimer(rest.remaining || DEFAULT_REST);
      tickTimerDisplay();
    });
    $('timerClose').addEventListener('click', dismissTimer);
    window.addEventListener('dashboard-sync-local-applied', () => {
      state = loadState();
      activeWorkoutId = null;
      renderHome();
    });
  }

  bindEvents();
  renderHome();
})();
</script>
</body>
</html>
